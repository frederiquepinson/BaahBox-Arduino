; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = PlatformIO version for BaahBoxArduino
default_envs = adafruit_feather_m0
src_dir = src
include_dir = src
extra_configs = 
	ini/esp32S3.ini
	ini/FeatherM0Bluefruit.ini
	ini/FeatherNRF52.ini

[common]
build_flags = -D __DEBUG__
lib_deps = 
default_src_filter = +<./*> +<Config> +<BaahBox/BLE> +<Sensors> +<Display>
	-<Display/ADA_OLED_FEATHERWING>
	-<Display/ADA_ESP32_TFT>
	-<BLE/ESP32S3>
	-<BLE/Nrf51>
	-<BLE/Nrf52>

[env]
framework = arduino
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_filters = colorize, time, send_on_enter

[env:adafruit_feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
build_flags = ${common.build_flags} -D USE_ESP32S3
build_src_filter = ${common.default_src_filter} +<BLE/ESP32S3> +<Display/ADA_TFT_SSD1306>
lib_deps = 
	${common.lib_deps}
	adafruit/Adafruit SSD1306@^2.5.7 // assuming we use the 'standard' FEATHER TFT 1306 featherwing as for the BlueFruit M0 or NRF52
	adafruit/Adafruit GFX Library@^1.11.5
debug_tool = jlink
monitor_speed = 115200
monitor_filters = colorize, time, send_on_enter, log2file, esp32_exception_decoder

[env:adafruit_feather_esp32s3_reverseTFT]
extends = env:adafruit_feather_esp32s3
build_flags = ${env:adafruit_feather_esp32s3.build_flags}
board = adafruit_feather_esp32s3_reversetft
build_src_filter = ${common.default_src_filter} +<BLE/ESP32S3>  +<Display/ADA_ESP32_TFT>
lib_deps = 
	${common.lib_deps}
	adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
	adafruit/Adafruit GFX Library@^1.11.5
	adafruit/Adafruit MAX1704X @ ^1.0.3

[env:adafruit_feather_m0]
platform = atmelsam
board = adafruit_feather_m0
build_flags = ${common.build_flags}  -D USE_NRF51 -D CHIP_SELECT_SD_PIN=10
lib_deps = 
	${common.lib_deps}
	arduino-libraries/SD@^1.2.4
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit BluefruitLE nRF51@^1.10.0
	adafruit/Adafruit GFX Library@^1.11.5
build_src_filter = ${common.default_src_filter}  +<BLE/Nrf51> +<Display/ADA_OLED_FEATHERWING>
monitor_speed = 115200
monitor_filters = colorize, time, send_on_enter, log2file

[env:adafruit_feather_nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
build_flags = ${common.build_flags} -D USE_NRF52
lib_deps = 
	${common.lib_deps}
	arduino-libraries/SD@^1.2.4
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit GFX Library@^1.11.5
	adafruit/Adafruit ADS7830@^1.0.0
build_src_filter = ${common.default_src_filter} +<BLE/Nrf52> +<Display/ADA_OLED_FEATHERWING>
monitor_speed = 115200
monitor_filters = colorize, time, send_on_enter, log2file
